<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Pietro Gorini</title>
  <link rel="icon" href="PP-MILK-THUMBNAIL.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    @font-face {
      font-family: 'Aktura-Regular';
      src: url('Aktura-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(90deg,
        #1f1828 0%,
        #EC5800 50%,
        #1f1828 100%
      );
      font-family: 'Aktura-Regular', serif;
    }

    .intro {
      text-align: center;
    }

    .intro h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      background: linear-gradient(90deg, #F28500 10%, #CCCCFF 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .intro a {
      display: block;
      margin: 0.6rem 0;
      font-size: 1.2rem;
      text-decoration: none;
      color: #222222;
    }

    .intro a:hover {
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="intro">
    <h1>Pietro Gorini</h1>
    <a href="gallery.html">Enter Gallery</a>
    <a href="about.html">About</a>
  </div>
</body>
</html>
